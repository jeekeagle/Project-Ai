<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listary �?工具介绍�?/title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #555555;
      --text-muted: #999999;
      --accent: #0891b2;
      --accent-light: #e0f7fa;
      --accent-dark: #0e7490;
      --border: #e5e7eb;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.09), 0 2px 6px rgba(0, 0, 0, 0.04);
      --radius: 12px;
    }

    .topbar{display:flex;align-items:center;justify-content:center;position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(255,255,255,0.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:9px 20px;box-shadow:0 1px 6px rgba(0,0,0,0.06)}
    .topbar a{font-size:.82rem;color:var(--accent);text-decoration:none;font-weight:600;letter-spacing:.02em}
    .topbar a:hover{text-decoration:underline}
    body{padding-top:56px}
    body {

      font-family: 'Noto Serif SC', 'Source Han Serif CN', Georgia, serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 680px;
      width: 100%;
      padding: 44px 48px;
      position: relative;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* Top-right decorative accent */
    .card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: linear-gradient(225deg, var(--accent-light) 0%, transparent 70%);
      border-radius: 0 var(--radius) 0 0;
      opacity: 0.7;
    }

    /* Header */
    .header {
      margin-bottom: 30px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-light);
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .tag svg {
      width: 10px;
      height: 10px;
      stroke: var(--accent);
      stroke-width: 2;
      fill: none;
    }

    .title {
      font-size: 25px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Section title */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* 2x2 Feature grid */
    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .feature {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: #fafafa;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feature-icon svg {
      width: 16px;
      height: 16px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .feature-body {
      flex: 1;
    }

    .feature-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .feature-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .feature-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      background: var(--accent-light);
      color: var(--accent-dark);
      padding: 1px 6px;
      border-radius: 3px;
      margin-left: 4px;
    }

    /* Workflow + Advanced */
    .bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    /* Workflow */
    .workflow {
      padding: 18px;
      background: #fafafa;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
    }

    .step + .step {
      border-top: 1px solid var(--border);
    }

    .step-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      color: white;
      background: var(--accent);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-text {
      font-size: 12px;
      color: var(--text-primary);
    }

    /* Advanced search panel */
    .advanced {
      padding: 18px;
      background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
      border-radius: 10px;
      border: 1px solid #a7f3d0;
    }

    .advanced-title {
      font-size: 11px;
      font-weight: 600;
      color: #065f46;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .custom-search {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #065f46;
    }

    .search-key {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: #d1fae5;
      color: #065f46;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #6ee7b7;
      min-width: 40px;
      text-align: center;
    }

    .search-example {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scenarios */
    .scenarios {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .scenario {
      font-size: 12px;
      color: var(--text-secondary);
      background: #f5f5f5;
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 16px;
    }

    /* Footer */
    .footer {
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-left {
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .dot {
      width: 5px;
      height: 5px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .card {
        padding: 30px 26px;
      }
      .features {
        grid-template-columns: 1fr;
      }
      .bottom-grid {
        grid-template-columns: 1fr;
      }
      .title {
        font-size: 22px;
      }
    }
  </style>
</head>
