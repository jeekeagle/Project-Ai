gn-items:center; gap:6px; font-size:11px; color:var(--text-3); letter-spacing:.01em; user-select:none; }.flip-icon { width:12px; height:12px; opacity:.5; transition:opacity .2s; } .card:hover .flip-icon { opacity:.9; }.card-back-content { padding:28px 32px 26px; }.card-back-label { font-size:10px; color:var(--text-3); letter-spacing:.1em; text-transform:uppercase; font-weight:500; margin-bottom:12px; }.card-back-body { font-size:15px; line-height:1.75; color:var(--text-2); font-weight:400; } .card-back-body p { margin:0 0 8px; } .card-back-body p:last-child { margin-bottom:0; }.card-back-question { margin-top:16px; padding-top:14px; border-top:.5px solid var(--border); font-size:12px; color:var(--text-3); line-height:1.65; } .card-back-question strong { color:var(--text-2); font-weight:500; }#endMarker { display:none; text-align:center; padding:56px 0; font-size:11px; color:var(--text-3); letter-spacing:.08em; opacity:0; animation:fadeIn .6s forwards; }@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}} @keyframes fadeIn{from{opacity:0;}to{opacity:1;}} @keyframes cardEntrance{from{opacity:0;transform:translateY(22px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}@media(max-width:768px){.main{padding:56px 16px 80px}.nav-inner{padding:0 16px}.page-header-title{font-size:40px}.page-header{margin-bottom:52px}.card-content-wrap,.card-back-content{padding:22px 18px 20px}.card-body{font-size:16px}}@media(max-width:480px){.main{padding:40px 12px 64px}.nav-inner{padding:0 12px}.page-header-title{font-size:32px}}
